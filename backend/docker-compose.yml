services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_PORT: ${API_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://app:local-dev-password@postgres:5432/llm_homework?sslmode=disable}
      RECOGNITION_PROVIDER: ${RECOGNITION_PROVIDER:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    networks:
      - api
      - database

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_homework}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database

  auth-integration-test:
    profiles:
      - test
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://app:local-dev-password@postgres:5432/llm_homework?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        /out/migrate -source file:///src/migrations -database "$$DATABASE_URL" up
        go test -tags=integration -count=1 ./internal/auth
    networks:
      - database

networks:
  api:
  database:
    internal: true

volumes:
  postgres_data:
